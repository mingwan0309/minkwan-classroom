<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>민관이교실</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;}

/* 상단 HUD */
.hud-top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;pointer-events:none;z-index:5;}
.hud-top > *{pointer-events:auto;}
.hbtn{min-height:44px;padding:0 14px;border-radius:12px;border:none;background:rgba(15,23,42,.72);color:#fff;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;backdrop-filter:blur(6px);text-decoration:none;}
.hbtn.icon{width:44px;padding:0;justify-content:center;font-size:18px;}
.study-box{margin-left:auto;background:rgba(15,23,42,.72);border-radius:12px;padding:6px 12px;text-align:right;backdrop-filter:blur(6px);min-height:44px;display:flex;flex-direction:column;justify-content:center;}
.study-box .l{font-size:11px;color:#cbd5e1;font-weight:600;}
.study-box .t{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}

/* 눈치 게이지 */
.gauge{position:fixed;top:calc(66px + env(safe-area-inset-top));left:12px;width:180px;background:rgba(15,23,42,.72);border-radius:12px;padding:8px 10px;z-index:5;backdrop-filter:blur(6px);pointer-events:none;}
.gauge .l{font-size:12px;font-weight:700;color:#e2e8f0;margin-bottom:5px;display:flex;justify-content:space-between;}
.gauge .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;}
.gauge .fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transition:width .2s;}

/* 말풍선 */
#bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);width:max-content;max-width:260px;background:#fff;color:#0f172a;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:800;line-height:1.4;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:6;pointer-events:none;opacity:0;transition:opacity .25s;}
#bubble.show{opacity:1;}
#bubble:after{content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:10px solid transparent;border-bottom:0;border-top-color:#fff;}
#bubble.warn{background:#fee2e2;color:#991b1b;}
#bubble.warn:after{border-top-color:#fee2e2;}
#bubble .who{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:700;color:#64748b;margin-bottom:3px;}
#bubble .bf{width:22px;height:22px;border-radius:50%;background:url('face.png') 50% 40%/130% no-repeat #e2e8f0;display:inline-block;}
#bubble.edge:after{display:none;}

/* 조준점 / 안내 */
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(0,0,0,.25);z-index:4;pointer-events:none;}
#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,23,42,.72);border-radius:12px;padding:8px 14px;font-size:13px;color:#e2e8f0;z-index:5;pointer-events:none;white-space:nowrap;backdrop-filter:blur(6px);}
#sit-btn{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);min-height:52px;padding:0 26px;border-radius:26px;border:none;background:#3b6cf7;color:#fff;font-size:16px;font-weight:800;box-shadow:0 8px 24px rgba(59,108,247,.5);z-index:6;display:none;cursor:pointer;}
#sit-btn.stand{background:#334155;box-shadow:0 8px 24px rgba(0,0,0,.4);}

/* 앉았을 때 큰 타이머 */
#seat-timer{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none;display:none;}
#seat-timer .l{font-size:13px;color:#e2e8f0;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);}
#seat-timer .t{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.6);}

/* 조이스틱 (폰) */
#joy{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);z-index:5;display:none;touch-action:none;}
#joy-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.55);}

/* 입장 화면 */
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;background:radial-gradient(circle at 50% 30%,#1e3a8a 0%,#0f172a 70%);padding:20px;}
.intro-card{width:100%;max-width:420px;text-align:center;}
.intro-face{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;background:url('face.png') 50% 42%/125% no-repeat #e2e8f0;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.intro-card h1{font-size:30px;font-weight:900;margin-bottom:8px;}
.intro-card p{font-size:15px;color:#cbd5e1;line-height:1.6;margin-bottom:6px;}
.intro-keys{margin:16px 0 20px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:13px;color:#e2e8f0;line-height:1.8;text-align:left;}
.intro-keys b{color:#fff;}
.name-row{margin:0 0 12px;text-align:left;}
.name-row label{display:block;font-size:13px;font-weight:700;color:#e2e8f0;margin-bottom:6px;}
#name-input{width:100%;min-height:50px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:16px;font-weight:700;padding:0 14px;outline:none;}
#name-input:focus{border-color:#60a5fa;}
#name-input::placeholder{color:#94a3b8;font-weight:500;}
#name-err{font-size:12px;color:#fca5a5;margin-top:5px;min-height:14px;}

/* 원상복구 카운트다운 (상단) */
.cd-chip{min-height:44px;padding:0 14px;border-radius:12px;background:rgba(15,23,42,.72);backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
.cd-chip.hot{background:rgba(220,38,38,.85);animation:cdPulse .5s ease-in-out infinite alternate;}
@keyframes cdPulse{from{transform:scale(1);}to{transform:scale(1.08);}}

/* 파탄 버튼 (물건 앞에 가면 나옴) */
#act-btn{position:fixed;left:50%;bottom:calc(126px + env(safe-area-inset-bottom));transform:translateX(-50%);min-height:56px;padding:0 26px;border-radius:28px;border:none;background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;font-size:17px;font-weight:900;box-shadow:0 8px 26px rgba(220,38,38,.5);z-index:6;display:none;cursor:pointer;white-space:nowrap;}
#act-btn:active{transform:translateX(-50%) scale(.95);}
#act-btn .k{font-size:12px;font-weight:700;opacity:.85;margin-left:6px;}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;transition:opacity .5s;}
#enter-btn{width:100%;min-height:54px;border:none;border-radius:14px;background:#3b6cf7;color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(59,108,247,.45);}
#loading{font-size:13px;color:#94a3b8;margin-top:10px;}

/* 일시정지(포인터 잠금 해제) */
#paused{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45);cursor:pointer;}
#paused div{background:rgba(15,23,42,.85);padding:14px 22px;border-radius:14px;font-size:15px;font-weight:700;}

@media (max-width:768px){
  .gauge{width:150px;}
  .study-box .t{font-size:15px;}
  #hint{font-size:12px;white-space:normal;width:calc(100% - 32px);text-align:center;bottom:calc(150px + env(safe-area-inset-bottom));}
  #sit-btn{left:auto;right:20px;transform:none;bottom:calc(40px + env(safe-area-inset-bottom));}
  #bubble{font-size:14px;max-width:220px;}
  .intro-card h1{font-size:26px;}
  #seat-timer .t{font-size:34px;}
  #act-btn{left:auto;right:16px;transform:none;bottom:calc(104px + env(safe-area-inset-bottom));padding:0 20px;font-size:16px;}
  #act-btn:active{transform:scale(.95);}
  #act-btn .k{display:none;}
  .cd-chip{font-size:14px;padding:0 12px;}
  #seat-timer{top:calc(126px + env(safe-area-inset-top));left:12px;transform:none;text-align:left;}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud-top">
  <button class="hbtn icon" id="snd-btn" title="소리 켜기/끄기">🔊</button>
  <div class="cd-chip" id="cd-chip">🧹 3:00</div>
  <div class="cd-chip" id="online-chip" style="display:none">👥 1명</div>
  <div class="study-box"><div class="l">오늘 공부한 시간</div><div class="t" id="today-t">00:00:00</div></div>
</div>
<div class="gauge"><div class="l"><span>👀 선생님 눈치</span><span id="gauge-pct">0%</span></div><div class="bar"><div class="fill" id="gauge-fill"></div></div></div>
<div id="bubble"></div>
<div id="flash"></div>
<button id="act-btn"></button>
<div id="cross"></div>
<div id="hint"></div>
<button id="sit-btn">🪑 내 자리에 앉기</button>
<div id="seat-timer"><div class="l">📖 지금 집중한 시간</div><div class="t" id="seat-t">00:00</div></div>
<div id="joy"><div id="joy-knob"></div></div>
<div id="paused"><div>화면을 누르면 다시 움직여요</div></div>

<div id="intro">
  <div class="intro-card">
    <div class="intro-face"></div>
    <h1>🏫 민관이교실</h1>
    <p>민관쌤이 교실 앞에서 감독하고 있어요.<br>물건 앞에 가면 버튼이 나와요. <b>책상 엎기, 의자 던지기, 숙제 찢기…</b></p>
    <p>칠판의 카운트다운이 끝나면 <b>3분마다 교실이 원래대로</b> 돌아와요.</p>
    <div class="intro-keys" id="intro-keys"></div>
    <div class="name-row">
      <label for="name-input">✏️ 이름</label>
      <input id="name-input" maxlength="12" placeholder="예) 김민관" autocomplete="off">
      <div id="name-err"></div>
    </div>
    <button id="enter-btn" disabled>불러오는 중...</button>
    <div id="loading"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
'use strict';
var IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
var IS_COARSE = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
var MOBILE = IS_TOUCH && IS_COARSE;

// ── 학생 이름 (말풍선용) ──
var myName = '';
try { myName = localStorage.getItem('mk_class_name') || ''; } catch(e) {}
function callName(){
  var n = String(myName || '').trim();
  if (!n) return '';
  if (n.length === 3) n = n.slice(1);           // 김민관 → 민관
  var last = n.charCodeAt(n.length - 1);
  if (last >= 0xAC00 && last <= 0xD7A3) return n + (((last - 0xAC00) % 28) ? '아' : '야');
  return n;
}
var CALL = callName();
function withName(s){ return CALL ? s.replace('{N}', CALL + ', ') : s.replace('{N}', ''); }

document.getElementById('intro-keys').innerHTML = MOBILE
  ? '🕹 <b>왼쪽 아래 동그라미</b>를 밀어서 걸어요<br>👆 <b>화면을 끌어서</b> 둘러봐요<br>💥 물건을 바라보면 뜨는 <b>빨간 버튼</b>으로 엎고 던져요<br>🪑 내 자리 근처에서 <b>앉기 버튼</b>을 눌러요'
  : '⌨️ <b>W A S D</b> (또는 방향키)로 걸어요 · <b>Shift</b> 빨리 걷기<br>🖱 <b>마우스</b>로 둘러봐요 (ESC로 마우스 풀기)<br>💥 물건을 바라보고 <b>F</b> 키 (또는 클릭)로 엎기 / 던지기<br>🪑 내 자리 근처에서 <b>E</b> 키로 앉기 / 일어서기';

// ── 소리 (음성) ──
var soundOn = true;
try { soundOn = localStorage.getItem('mk_class_sound') !== 'off'; } catch(e) {}
var sndBtn = document.getElementById('snd-btn');
function renderSnd(){ sndBtn.textContent = soundOn ? '🔊' : '🔇'; }
renderSnd();
sndBtn.onclick = function(e){
  e.stopPropagation();
  soundOn = !soundOn;
  try { localStorage.setItem('mk_class_sound', soundOn ? 'on' : 'off'); } catch(err) {}
  if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  renderSnd();
};
var koVoice = null;
function pickVoice(){
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices() || [];
  var ko = vs.filter(function(v){ return /ko/i.test(v.lang); });
  // 남자 목소리를 우선
  koVoice = ko.filter(function(v){ return /male|남|InJoon|Hyunsu|Bong/i.test(v.name) && !/female/i.test(v.name); })[0] || ko[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if (!soundOn || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.replace(/[^가-힣a-zA-Z0-9 ,.!?~]/g, ''));
    u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice;
    u.rate = 1.05; u.pitch = 0.85;
    speechSynthesis.speak(u);
  } catch(e) {}
}

// ── 공부 시간 기록 (이 기기에만 저장) ──
function todayKey(){ var d = new Date(); return 'mk_class_study_' + d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
var todaySec = 0;
try { todaySec = parseInt(localStorage.getItem(todayKey()) || '0', 10) || 0; } catch(e) {}
function fmt(sec, withHour){
  sec = Math.floor(sec);
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return withHour || h ? p(h) + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
}

// ═══════════════ 3D 장면 ═══════════════
var canvas = document.getElementById('cv');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !MOBILE });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MOBILE ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe7f2);
scene.fog = new THREE.Fog(0xdfe7f2, 18, 40);
var camera = new THREE.PerspectiveCamera(70, 1, 0.05, 80);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xffffff, 0xb59b7a, 0.85));
var sun = new THREE.DirectionalLight(0xfff4e0, 0.55); sun.position.set(-6, 8, 2); scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

// 교실 크기
var RX = 7, RZ_FRONT = -10, RZ_BACK = 10, RH = 3.4;

function canvasTex(w, h, draw){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  return t;
}
function lam(color, extra){ var o = { color: color }; for (var k in extra) o[k] = extra[k]; return new THREE.MeshLambertMaterial(o); }
function box(w, h, d, mat, x, y, z, parent){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); (parent || scene).add(m); return m;
}

// ═══════════════ 물리 (cannon.js) ═══════════════
var world = new CANNON.World();
world.gravity.set(0, -9.82, 0);
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 8;
var M_DEF = new CANNON.Material('def'), M_BALL = new CANNON.Material('ball');
world.addContactMaterial(new CANNON.ContactMaterial(M_DEF, M_DEF, { friction: 0.45, restitution: 0.18 }));
world.addContactMaterial(new CANNON.ContactMaterial(M_BALL, M_DEF, { friction: 0.3, restitution: 0.72 }));
function V3(x, y, z){ return new CANNON.Vec3(x, y, z); }
function staticPlane(x, y, z, ax, ay, az, ang){
  var b = new CANNON.Body({ mass: 0, material: M_DEF }); b.addShape(new CANNON.Plane());
  b.position.set(x, y, z); if (ang) b.quaternion.setFromAxisAngle(V3(ax, ay, az), ang);
  world.addBody(b);
}
function staticBox(hx, hy, hz, x, y, z){
  var b = new CANNON.Body({ mass: 0, material: M_DEF }); b.addShape(new CANNON.Box(V3(hx, hy, hz)));
  b.position.set(x, y, z); world.addBody(b);
}

// 움직이는 물건 목록 — 3분마다 home 위치로 돌아감
var objs = [], debris = [], pickList = [];
function addObj(o){
  var b = o.body;
  b.material = o.ball ? M_BALL : M_DEF;
  b.allowSleep = true; b.sleepSpeedLimit = 0.15; b.sleepTimeLimit = 0.6;
  b.position.set(o.mesh.position.x, o.mesh.position.y, o.mesh.position.z);
  b.quaternion.set(o.mesh.quaternion.x, o.mesh.quaternion.y, o.mesh.quaternion.z, o.mesh.quaternion.w);
  o.homeP = o.mesh.position.clone(); o.homeQ = o.mesh.quaternion.clone();
  b.obj = o;
  b.addEventListener('collide', onObjHit);
  world.addBody(b); b.sleep();
  o.mesh.userData.obj = o;
  pickList.push(o.mesh);
  objs.push(o);
  return o;
}
function wakeNear(p, r){
  objs.forEach(function(o){ if (!o.anim && !o.gone && o.body.position.distanceTo(p) < r) o.body.wakeUp(); });
}

// ── 효과음 (WebAudio로 직접 만듦, 파일 없음) ──
var actx = null, noiseBuf = null, lastThud = 0;
function ac(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return actx;
}
function noise(dur, type, f0, f1, vol){
  var a = soundOn && ac(); if (!a) return;
  var t = a.currentTime, src = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; flt.type = type; flt.Q.value = 1.2;
  flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(a.destination);
  src.start(t, Math.random() * 0.5); src.stop(t + dur);
}
function tone(freq, dur, vol, type, at){
  var a = soundOn && ac(); if (!a) return;
  var t = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (!type) o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
}
function sfxThud(k, light){

var fwdV = new THREE.Vector3();

function awayDir(o){   // 나 → 물건 (수평)

function throwObj(o, speed, up){

  b.position.set(camera.position.x + f.x * 0.75, Math.max(0.5, camera.position.y - 0.25 + f.y * 0.5), camera.position.z + f.z * 0.75);

// 지금 바라보는 물건 찾기: 화면 가운데 조준점 → 없으면 가까이 있고 앞쪽에 있는 것
var ray = new THREE.Raycaster(); ray.far = 2.8;
function findTarget(){
  var f = lookDir();
  ray.set(camera.position, f);
  var hits = ray.intersectObjects(pickList, true);
  for (var i = 0; i < hits.length; i++) {
    var n = hits[i].object; while (n && !n.userData.obj) n = n.parent;
    if (n && n.visible && !n.userData.obj.anim) return n.userData.obj;
  }
  var fh = Math.hypot(f.x, f.z) || 1, best = null, bs = 1e9;
  objs.forEach(function(o){
    if (o.gone || o.anim) return;
    var dx = o.body.position.x - player.x, dz = o.body.position.z - player.z, d = Math.hypot(dx, dz);
    if (d > 1.5) return;
    var ang = Math.acos(Math.max(-1, Math.min(1, (dx * f.x + dz * f.z) / (d * fh || 1))));
    if (ang > 0.8) return;
    var sc = d + ang * 1.2 + (o.light ? -0.2 : 0);
    if (sc < bs) { bs = sc; best = o; }
  });
  return best;
}

// ── 3분마다 원상복구 (모든 기기가 같은 시각에 돌아오도록 실제 시계 기준) ──
var CYCLE = 180, RESET_ANIM = 1.3;
function remainSec(){ return CYCLE - (Date.now() / 1000) % CYCLE; }
var lastRemain = remainSec(), resetting = 0, shownSec = -1;
function startReset(){
  debris.forEach(function(d){ world.remove(d.body); scene.remove(d.mesh); d.mesh.geometry.dispose(); });
  debris = [];
  objs.forEach(function(o){
    var moved = o.gone || o.mesh.position.distanceTo(o.homeP) > 0.01 || o.mesh.quaternion.angleTo(o.homeQ) > 0.02;
    if (!moved) return;
    if (!o.gone) world.remove(o.body);
    o.anim = { p0: o.mesh.position.clone(), q0: o.mesh.quaternion.clone(), t: 0, pop: o.gone };
    o.gone = false; o.mesh.visible = true;
    o.mesh.children.forEach(function(c){ if (c.name === 'paper') c.visible = true; });

// ── 충돌 ──
var PR = 0.28, dynColliders = [];
function buildDynColliders(){

    if (!o.solid || o.anim) return;
    var b = o.body; b.computeAABB();
    var lb = b.aabb.lowerBound, ub = b.aabb.upperBound;

function collide(nx, nz){

  for (var i = 0; i < colliders.length; i++) {
    var c = colliders[i];
    if (nx > c.x1 - PR && nx < c.x2 + PR && nz > c.z1 - PR && nz < c.z2 + PR) {
      var pl = nx - (c.x1 - PR), pr = (c.x2 + PR) - nx, pf = nz - (c.z1 - PR), pb = (c.z2 + PR) - nz;
      var m = Math.min(pl, pr, pf, pb);

    }

  for (var j = 0; j < dynColliders.length; j++) {
    var q = dynColliders[j];
    if (nx > q.x1 - PR && nx < q.x2 + PR && nz > q.z1 - PR && nz < q.z2 + PR) {
      var ql = nx - (q.x1 - PR), qr = (q.x2 + PR) - nx, qf = nz - (q.z1 - PR), qb = (q.z2 + PR) - nz;
      var qm = Math.min(ql, qr, qf, qb);
      if (qm === ql) nx = q.x1 - PR; else if (qm === qr) nx = q.x2 + PR; else if (qm === qf) nz = q.z1 - PR; else nz = q.z2 + PR;
    }
  }
  nx = Math.max(-RX + PR, Math.min(RX - PR, nx));
  nz = Math.max(RZ_FRONT + 0.5 + PR, Math.min(RZ_BACK - PR, nz));

}

// ── 매 프레임 ──
var gaugeFill = document.getElementById('gauge-fill'), gaugePct = document.getElementById('gauge-pct');

function update(dt){
  buildDynColliders();

  var moving = false;
  if (started && !player.seated) {
    var f = 0, s = 0;
    if (keys.KeyW || keys.ArrowUp) f += 1;
    if (keys.KeyS || keys.ArrowDown) f -= 1;
    if (keys.KeyA || keys.ArrowLeft) s -= 1;
    if (keys.KeyD || keys.ArrowRight) s += 1;
    if (joyId !== null) { f -= joyV.y; s += joyV.x; }
    var len = Math.hypot(f, s);
    if (len > 0.08) {
      if (len > 1) { f /= len; s /= len; }
      var sp = (keys.ShiftLeft || keys.ShiftRight) ? 3.6 : 2.2;
      var sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
      var dx = (-sinY * f + cosY * s) * sp * dt, dz = (-cosY * f - sinY * s) * sp * dt;
      var r = collide(player.x + dx, player.z + dz);

    }

    T.mode = 'scold'; T.scoldT = 5;
    say(LINES.warn[Math.min(warnCount, LINES.warn.length - 1)], true, 4.5);
    warnCount++;
    wander = WARN_AT * 0.45;   // 다시 조금만 걸어도 또 혼남
  }

  // 선생님 가까이 가면 한마디

  if (started && !player.seated && distT < 1.4 && nearCool <= 0 && T.mode !== 'scold' && bubbleT <= 0) { say(pick(LINES.near), false); nearCool = 14; }

  updateSeatUI();

  // ── 물리 ──
  var pb = playerBody.position;
  playerBody.collisionFilterMask = player.seated ? 0 : -1;
  playerBody.velocity.set((player.x - pb.x) / dt, 0, (player.z - pb.z) / dt);
  var tb = teacherBody.position, tp = teacher.position;
  teacherBody.velocity.set((tp.x - tb.x) / dt, 0, (tp.z - tb.z) / dt);

  tb.set(tp.x, tp.y + 1.0, tp.z);
  var nowS = performance.now() / 1000;
  objs.forEach(function(o){
    if (o.anim || o.gone) return;
    var b = o.body;
    if (b.position.y < -1 || Math.abs(b.position.x) > RX + 1 || b.position.z < RZ_FRONT - 1 || b.position.z > RZ_BACK + 1) {   // 벽 밖으로 빠지면 제자리로
      b.position.set(o.homeP.x, o.homeP.y, o.homeP.z); b.velocity.set(0, 0, 0); b.angularVelocity.set(0, 0, 0);

function updateTeacher(dt){

// 말풍선 위치: 선생님 머리 위로 (화면 밖이면 화면 가장자리)

  tmpV.set(0, 0, 0); head.getWorldPosition(tmpV); tmpV.y += 0.36;
  var v = tmpV.clone().project(camera);
  var W = window.innerWidth, H = window.innerHeight;
  var behind = v.z > 1;
  var x = (v.x * 0.5 + 0.5) * W, y = (-v.y * 0.5 + 0.5) * H;
  if (behind) { x = W - x; y = H * 0.3; }
  var bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  var edge = behind || x < bw / 2 + 10 || x > W - bw / 2 - 10 || y < bh + 80 || y > H - 20;
  x = Math.max(bw / 2 + 10, Math.min(W - bw / 2 - 10, x));
  var minY = bh + 120;
  y =Math.max(minY, Math.min(H - 170, y));
  bubble.style.left = x + 'px'; bubble.style.top = y + 'px';
  bubble.classList.toggle('edge', edge);
}

// ═══════════════ 같이 접속 (교실 전용 Firebase Realtime Database) ═══════════════
// players/{netId} = { n:이름, x, z, y:바라보는 방향, s:앉았나, t:서버시각 } — 나가면 자동 삭제(onDisconnect)
var FB_CONFIG = {

var netId = (Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10)).slice(0, 14);
var others = {}, netRef = null, netOffset = 0, MAX_OTHERS = 40;
var onlineChip = document.getElementById('online-chip');
var AV_COLORS = [0xef4444, 0xf97316, 0xeab308, 0x22c55e, 0x14b8a6, 0x3b82f6, 0x8b5cf6, 0xec4899];
function hashOf(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function drawNameLabel(tex, text){
  var c = tex.image, g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.font = '800 34px Pretendard, sans-serif';
  var w = Math.min(c.width - 4, g.measureText(text).width + 36);
  g.fillStyle = 'rgba(15,23,42,.82)';
  g.beginPath(); if (g.roundRect) g.roundRect((c.width - w) / 2, 4, w, c.height - 8, 26); else g.rect((c.width - w) / 2, 4, w, c.height - 8); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, c.width / 2, c.height / 2 + 2, c.width - 30);
  tex.needsUpdate = true;
}
function makeAvatar(id){
  var g = new THREE.Group(); scene.add(g);
  var col = lam(AV_COLORS[hashOf(id) % AV_COLORS.length]), pants = lam(0x334155);
  var legs = [-1, 1].map(function(s){
    var hip = new THREE.Group(); hip.position.set(s * 0.1, 0.8, 0); g.add(hip);
    box(0.14, 0.78, 0.16, pants, 0, -0.39, 0, hip); return hip;
  });
  box(0.44, 0.6, 0.26, col, 0, 1.1, 0, g);                                      // 몸통(교복 색)
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 18, 14), skin); head.position.y = 1.58; g.add(head);
  var hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.178, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
  hairCap.position.set(0, 1.6, -0.01); g.add(hairCap);
  var eyeM = lam(0x111111);
  box(0.03, 0.035, 0.02, eyeM, -0.06, 1.6, 0.16, g); box(0.03, 0.035, 0.02, eyeM, 0.06, 1.6, 0.16, g);
  var tex = canvasTex(320, 72, function(){});
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(1.0, 0.225, 1); sp.position.y = 2.02; sp.renderOrder = 5; g.add(sp);
  var sh = new THREE.Mesh(new THREE.CircleGeometry(0.3, 20), shadow.material); sh.rotation.x = -Math.PI / 2; sh.position.y = 0.012; g.add(sh);
  return { g: g, legs: legs, tex: tex, name: null, x: 0, z: 0, yaw: 0, sit: 0, ph: 0, data: null };
}
function netUpsert(snap){
  if (snap.key === netId) return;
  var v = snap.val(); if (!v || typeof v.x !== 'number' || typeof v.z !== 'number') return;
  var o = others[snap.key];
  if (!o) {
    if (Object.keys(others).length >= MAX_OTHERS) return;
    o = others[snap.key] = makeAvatar(snap.key);
    o.x = v.x; o.z = v.z; o.yaw = v.y || 0;
  }
  var nm = String(v.n || '').slice(0, 12) || '친구';
  if (o.name !== nm) { o.name = nm; drawNameLabel(o.tex, nm); }
  o.data = v;
}
function netRemove(snap){
  var o = others[snap.key]; if (!o) return;
  scene.remove(o.g); delete others[snap.key];
}
function netStart(){
  if (netRef || !window.firebase || !firebase.database) return;   // 불러오지 못하면 혼자 하는 교실 그대로
  try {
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    var db = firebase.database();
    db.ref('.info/serverTimeOffset').on('value', function(s){ netOffset = s.val() || 0; });
    netRef = db.ref('players/' + netId);
    db.ref('.info/connected').on('value', function(s){
      if (!s.val()) return;
      netRef.onDisconnect().remove();
      netSend();
    });
    var pl = db.ref('players');
    pl.on('child_added', netUpsert); pl.on('child_changed', netUpsert); pl.on('child_removed', netRemove);
    onlineChip.style.display = '';
  } catch(e) { console.warn('[민관이교실] 같이 접속 연결 실패', e); netRef = null; }
}
function normYaw(a){ var t = Math.PI * 2; return +(((a % t) + t) % t).toFixed(2); }
var netLast = null, netSendT = 0, netBeatT = 0;
function netSend(){
  if (!netRef) return;
  netLast = { x: +player.x.toFixed(2), z: +player.z.toFixed(2), y: normYaw(player.yaw), s: !!player.seated };
  netRef.set({ n: myName || '', x: netLast.x, z: netLast.z, y: netLast.y, s: netLast.s, t: firebase.database.ServerValue.TIMESTAMP })
    .catch(function(e){ console.warn('[민관이교실] 위치 보내기 실패', e); });
}
function netUpdate(dt){
  if (netRef && started) {
    netSendT -= dt; netBeatT -= dt;
    var changed = !netLast || Math.abs(player.x - netLast.x) > 0.03 || Math.abs(player.z - netLast.z) > 0.03 ||
      Math.abs(angDiff(player.yaw, netLast.y)) > 0.08 || !!player.seated !== netLast.s;
    if ((changed && netSendT <= 0) || netBeatT <= 0) { netSend(); netSendT = 0.12; netBeatT = 10; }   // 움직일 때 초당 8번, 가만히 있으면 10초마다
  }
  var now = Date.now() + netOffset, count = netRef ? 1 : 0, k = Math.min(1, dt * 10);
  for (var id in others) {
    var o = others[id], v = o.data;
    if (!v || (typeof v.t === 'number' && now - v.t > 40000)) { o.g.visible = false; continue; }   // 오래 소식 없는 사람은 숨김
    o.g.visible = true; count++;
    var px = o.x, pz = o.z;
    o.x += (v.x - o.x) * k; o.z += (v.z - o.z) * k;
    o.yaw += angDiff(v.y || 0, o.yaw) * k;
    o.sit += ((v.s ? 1 : 0) - o.sit) * k;
    var sp = Math.hypot(o.x - px, o.z - pz) / Math.max(dt, 0.001);
    if (sp > 0.3) o.ph += dt * 9; else o.ph *= 0.8;
    var sw = Math.sin(o.ph) * Math.min(0.6, sp * 0.25);
    o.legs[0].rotation.x = sw - o.sit * 1.4; o.legs[1].rotation.x = -sw - o.sit * 1.4;
    o.g.position.set(o.x, -o.sit * 0.36, o.z);
    o.g.rotation.y = o.yaw + Math.PI;
  }
  if (netRef) { var t = '👥 ' + count + '명'; if (onlineChip.textContent !== t) onlineChip.textContent = t; }
}
